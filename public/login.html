<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Login - API</title>
  <style>
    body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background-color: #f4f4f9; }
    .card { background: #fff; padding: 20px 30px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); width: 300px; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    input { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
    button { width: 100%; padding: 10px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
    button:hover { background-color: #0056b3; }
    #message { margin-top: 15px; text-align: center; font-weight: bold; }
    .success { color: green; }
    .error { color: red; }
  </style>
</head>
<body>

  <div class="card">
    <h2>Entrar</h2>
    <form id="loginForm">
      <div class="form-group">
        <label for="username">Usuário:</label>
        <input type="text" id="username" required>
      </div>
      <div class="form-group">
        <label for="password">Senha:</label>
        <input type="password" id="password" required>
      </div>
      <button type="submit">Acessar</button>
    </form>
    <div id="message"></div>
  </div>

  <script>
    const form = document.getElementById('loginForm');
    const messageDiv = document.getElementById('message');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;

      messageDiv.textContent = 'Autenticando...';
      messageDiv.className = '';

      try {
        const response = await fetch('http://localhost:3000/api/auth/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          // Obrigatório para salvar/receber os cookies no navegador!
          credentials: 'include', 
          body: JSON.stringify({ username, password })
        });

        const data = await response.json();

        if (response.ok && data.success) {
          messageDiv.textContent = 'Login efetuado! Redirecionando...';
          messageDiv.className = 'success';
          
          // Opcional: redirecionar para uma página principal após 1 segundo
          setTimeout(() => {
            // window.location.href = '/dashboard.html';
            alert('Você está logado com sucesso!');
          }, 1000);
        } else {
          messageDiv.textContent = data.message || 'Erro ao realizar login.';
          messageDiv.className = 'error';
        }
      } catch (error) {
        messageDiv.textContent = 'Erro ao se conectar com o servidor.';
        messageDiv.className = 'error';
      }
    });
  </script>

</body>
</html>
